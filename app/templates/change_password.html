{% extends "base.html" %}
{% block title %}Ganti Kata Sandi - {{ app_name }}{% endblock %}
{% block content %}
<section class="page-head">
  <h1>Ganti Kata Sandi</h1>
  <p class="muted">Gunakan kata sandi baru minimal 12 karakter, berisi huruf besar, huruf kecil, angka, dan simbol.</p>
</section>
<section class="card narrow">
  <form method="post" action="/change-password" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="current_password">Kata sandi saat ini</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">Kata sandi baru</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
    {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="primary">Simpan Kata Sandi</button>
  </form>
</section>
{% endblock %}
